name: Update cobrança AI pricing and SMS scope
on:
  push:
    branches: [fix/cobranca-ai-015-sms-enterprise]
    paths:
      - .github/workflows/update-cobranca-ai-015-sms-enterprise.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cobranca-ai-015-sms-enterprise
          fetch-depth: 0
      - name: Update public billing claims
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(file, pairs):
              p=Path(file); s=p.read_text(encoding='utf-8')
              for old,new in pairs:
                  if old in s:
                      s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          replace('index.html',[
            ('<li>Cobrança e recebíveis com WhatsApp, SMS e e-mail, boleto, Pix, baixa e conciliação</li>', '<li><strong>Régua de cobrança com IA</strong> para automatizar cobrança em WhatsApp e e-mail · <strong>R$ 0,15 por envio</strong></li>'),
            ('<li>Régua de cobrança customizada por carteira</li>', '<li>Régua de cobrança customizada por carteira</li>\n          <li><strong>SMS disponível exclusivamente no Enterprise</strong> · escopo e volume sob medida</li>'),
            ('Régua de cobrança automatizada em WhatsApp, SMS e e-mail', 'Régua de cobrança com IA em WhatsApp e e-mail; SMS disponível exclusivamente no Enterprise'),
            ('CRM de crédito, CORBAN AI, simulação e acompanhamento de financiamento, contratos, cobrança, recebíveis, portal, gestão de unidades e analytics. 40% da comissão de originação.', 'CRM de crédito, CORBAN AI, simulação e acompanhamento de financiamento, contratos e régua de cobrança com IA em WhatsApp e e-mail por R$ 0,15 por envio, recebíveis, portal, gestão de unidades e analytics. 40% da comissão de originação.'),
            ('Preço sob medida, contrato anual: tudo do Credituz OS, mais multiempresa, usuários e contratos ilimitados, 75% da comissão de originação, políticas por empresa e produto, back office operacional e financeiro, cobrança customizada, NFe, contas via API, White Label, API pública, SSO, auditoria e SLA 99,9%.', 'Preço sob medida, contrato anual: tudo do Credituz OS, mais multiempresa, usuários e contratos ilimitados, 75% da comissão de originação, políticas por empresa e produto, back office operacional e financeiro, cobrança customizada com SMS disponível, NFe, contas via API, White Label, API pública, SSO, auditoria e SLA 99,9%.')
          ])

          replace('pages/cobranca-e-recebiveis-imobiliarios.html',[
            ('Automatize cobrança imobiliária com régua em WhatsApp, SMS e e-mail, Pix, boleto, baixa, conciliação e NFe em uma única plataforma.', 'Automatize a cobrança imobiliária com IA por WhatsApp e e-mail, por R$ 0,15 por envio, além de Pix, boleto, baixa e conciliação. SMS está disponível no Enterprise sob medida.'),
            ('Configure lembretes antes e depois do vencimento por WhatsApp, SMS e e-mail.', 'Configure uma régua de cobrança com IA por WhatsApp e e-mail. Cada envio custa R$ 0,15. SMS está disponível exclusivamente no Enterprise, sob medida.')
          ])

          replace('pages/regua-de-cobranca-imobiliaria.html',[
            ('Automatize lembretes e cobranças de parcelas imobiliárias por WhatsApp, SMS e e-mail com régua configurável na Credituz.', 'Automatize cobranças de parcelas imobiliárias por WhatsApp e e-mail com IA. Cada envio custa R$ 0,15. SMS está disponível exclusivamente no Enterprise, sob medida.'),
            ('A Credituz permite configurar uma régua automática para parcelas de entrada, recebíveis e cobranças recorrentes, com mensagens por WhatsApp, SMS e e-mail.', 'A Credituz permite configurar uma régua de cobrança com IA para parcelas de entrada, recebíveis e cobranças recorrentes, com mensagens automáticas por WhatsApp e e-mail por R$ 0,15 por envio. SMS está disponível exclusivamente no Enterprise, sob medida.')
          ])

          replace('pages/construtoras.html',[
            ('Régua automática em WhatsApp, SMS e e-mail para as parcelas da entrada, com boleto, Pix e link na própria mensagem, baixa automática e conciliação.', 'Régua de cobrança com IA em WhatsApp e e-mail para as parcelas da entrada, por R$ 0,15 por envio, com boleto, Pix, baixa e conciliação. SMS está disponível no Enterprise sob medida.'),
            ('É. A régua dispara em WhatsApp, SMS e e-mail na ordem que você definir, com boleto, Pix e link de pagamento na própria mensagem, baixa automática e conciliação — sem time de cobrança.', 'É. A régua automatiza a cobrança por WhatsApp e e-mail, por R$ 0,15 por envio, com boleto, Pix, baixa e conciliação. SMS está disponível exclusivamente no Enterprise, sob medida.')
          ])

          replace('pages/imobiliarias.html',[
            ('Régua automática do aluguel e das parcelas em WhatsApp, SMS e e-mail, com boleto, Pix e link na mensagem, baixa automática, conciliação, NFe e repasse ao proprietário.', 'Régua de cobrança com IA para aluguel e parcelas em WhatsApp e e-mail, por R$ 0,15 por envio, com boleto, Pix, baixa, conciliação, NFe e repasse ao proprietário. SMS está disponível no Enterprise sob medida.'),
            ('É. A régua dispara em WhatsApp, SMS e e-mail na ordem que você definir, com boleto, Pix e link na própria mensagem, baixa automática, conciliação, NFe e repasse ao proprietário.', 'É. A régua automatiza a cobrança por WhatsApp e e-mail, por R$ 0,15 por envio, com boleto, Pix, baixa, conciliação, NFe e repasse ao proprietário. SMS está disponível exclusivamente no Enterprise, sob medida.')
          ])

          # Machine-readable structured source.
          p=Path('home.json'); data=json.loads(p.read_text(encoding='utf-8'))
          for node in data.get('@graph',[]):
              if node.get('@type')=='SoftwareApplication':
                  fl=node.get('featureList',[])
                  node['featureList']=[('Régua de cobrança com IA em WhatsApp e e-mail por R$ 0,15 por envio; SMS disponível exclusivamente no Enterprise' if 'Régua de cobrança' in x else x) for x in fl]
                  for offer in node.get('offers',[]):
                      if offer.get('name')=='Credituz OS':
                          offer['description']='R$ 297 por mês mais R$ 16 por análise. CRM de crédito, CORBAN AI, financiamento, contratos, régua de cobrança com IA em WhatsApp e e-mail por R$ 0,15 por envio, recebíveis, portal, gestão de unidades e analytics. 40% da comissão de originação.'
                      if offer.get('name')=='Enterprise':
                          offer['description']='Preço sob medida, contrato anual: tudo do Credituz OS, mais multiempresa, escala, 75% da comissão, políticas customizadas, back office operacional e financeiro, cobrança customizada com SMS disponível, White Label, API, SSO, auditoria e SLA 99,9%.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for file in ['home.md','llms-full.txt']:
              p=Path(file); s=p.read_text(encoding='utf-8')
              s=s.replace('cobrança e recebíveis, portal de vendas, espelho de empreendimento, gestão de unidades, analytics e 40% da comissão de originação.', 'régua de cobrança com IA em WhatsApp e e-mail por R$ 0,15 por envio, recebíveis, portal de vendas, espelho de empreendimento, gestão de unidades, analytics e 40% da comissão de originação.')
              s=s.replace('back office operacional e financeiro, cobrança customizada, NFe, contas via API, White Label, API pública, SSO, auditoria, SLA 99,9%, CS nominal e armazenamento customizado.', 'back office operacional e financeiro, cobrança customizada com SMS disponível exclusivamente neste plano, NFe, contas via API, White Label, API pública, SSO, auditoria, SLA 99,9%, CS nominal e armazenamento customizado.')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate public pricing claims
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'Régua de cobrança com IA' in s
          assert 'R$ 0,15 por envio' in s
          assert 'SMS disponível exclusivamente no Enterprise' in s
          assert 'Cobrança e recebíveis com WhatsApp, SMS e e-mail' not in s
          for f in ['pages/cobranca-e-recebiveis-imobiliarios.html','pages/regua-de-cobranca-imobiliaria.html','pages/construtoras.html','pages/imobiliarias.html']:
              x=Path(f).read_text(encoding='utf-8')
              assert 'R$ 0,15 por envio' in x, f
              assert 'SMS está disponível' in x, f
          print('billing pricing and SMS scope validated')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-cobranca-ai-015-sms-enterprise.yml
          git add index.html home.json home.md llms-full.txt pages/cobranca-e-recebiveis-imobiliarios.html pages/regua-de-cobranca-imobiliaria.html pages/construtoras.html pages/imobiliarias.html
          git commit -m "fix: clarify AI billing price and Enterprise-only SMS"
          git push origin HEAD:fix/cobranca-ai-015-sms-enterprise
