name: Apply CRM de credito positioning

on:
  push:
    branches:
      - feat/crm-credito-positioning
    paths:
      - .github/workflows/apply-crm-credito-positioning.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-credito-positioning
          fetch-depth: 0
      - name: Update home CRM positioning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<li><a href="#produto">CRM com IA</a></li>', '<li><a href="./pages/crm-de-credito.html">CRM de crédito</a></li>')
          s = s.replace('CRM imobiliário e de crédito', 'CRM de crédito para simulação, solicitação e acompanhamento de financiamentos')
          s = s.replace('plataforma inteira: CRM, agentes de IA, simulação multibancos, contratos, portal de vendas no domínio do cliente e originação de crédito.', 'plataforma inteira: CRM de crédito, agentes de IA, simulação multibancos, solicitação e acompanhamento de financiamentos, contratos, portal de vendas no domínio do cliente e originação de crédito.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: reposition CRM as credit CRM"
          git push origin HEAD:feat/crm-credito-positioning
