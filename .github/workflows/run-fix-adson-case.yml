name: Fix Adson case visual
on:
  push:
    branches:
      - fix/adson-case-card-visual
    paths:
      - .github/workflows/run-fix-adson-case.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adson-case-card-visual
          fetch-depth: 0
      - name: Apply visual fix
        run: python3 scripts/fix-adson-case-card.py
      - name: Validate expected markup
        run: |
          grep -q 'arch-case-meta' index.html
          grep -q 'arch-case-avatar' index.html
          grep -q 'Gestor de Incorporação · NJS Engenharia' index.html
          ! grep -q '<footer>Adson Soares · Gestor de Incorporação · NJS Engenharia</footer>' index.html
      - name: Commit visual fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix-adson-case-card.py .github/workflows/run-fix-adson-case.yml
          git add index.html
          git commit -m "fix: melhora visual do case do Adson na home"
          git push origin HEAD:fix/adson-case-card-visual
