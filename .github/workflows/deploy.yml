name: Deploy Credituz site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*type=["\']application/ld\+json["\'])[^>]*>(.*?)</script>',s,re.I|re.S)
          Path('/tmp/inline-js').mkdir(exist_ok=True)
          for i,x in enumerate(scripts,1):
              (Path('/tmp/inline-js')/f'{i:02d}.js').write_text(x,encoding='utf-8')
          PY
          for f in /tmp/inline-js/*.js; do node --check "$f"; done
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  visual-qa:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Capture desktop and mobile screenshots
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('qa-screenshots',{recursive:true});
          const base=(process.env.PAGE_URL||'https://credituz.ai/').replace(/\/$/,'');
          const pages=[['home','/'],['score','/pages/credituz-score.html']];
          const viewports=[['desktop',1440,1000],['mobile',390,844]];
          const browser=await chromium.launch({headless:true});
          let failed=false;
          async function revealAnimatedSections(page){
            await page.evaluate(async()=>{
              await new Promise(resolve=>{
                let last=-1,stable=0;
                const step=Math.max(320,Math.floor(window.innerHeight*0.75));
                const timer=setInterval(()=>{
                  window.scrollBy(0,step);
                  const y=window.scrollY;
                  const bottom=window.innerHeight+y>=document.documentElement.scrollHeight-4;
                  if(y===last) stable++; else stable=0;
                  last=y;
                  if(bottom||stable>3){clearInterval(timer);resolve();}
                },80);
              });
            });
            await page.waitForTimeout(500);
          }
          for(const [name,path] of pages){
            for(const [device,width,height] of viewports){
              const page=await browser.newPage({viewport:{width,height}});
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              const res=await page.goto(base+path,{waitUntil:'networkidle',timeout:60000});
              if(!res || !res.ok()){console.error(name,device,'HTTP',res&&res.status());failed=true;}
              await revealAnimatedSections(page);
              await page.screenshot({path:`qa-screenshots/${name}-${device}.png`,fullPage:true});
              const metrics=await page.evaluate(()=>({sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,h1:document.querySelectorAll('h1').length,body:document.body.innerText.length}));
              console.log(name,device,metrics,'pageErrors',errors.length);
              if(metrics.sw>metrics.cw+2 || metrics.h1!==1 || metrics.body<500 || errors.length){failed=true;console.error({name,device,metrics,errors});}
              await page.close();
            }
          }
          await browser.close();
          if(failed) process.exit(1);
          JS
          node qa.mjs
      - name: Validate paid-media events at runtime
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          cat > tracking-smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const base=(process.env.PAGE_URL||'https://credituz.ai/').replace(/\/$/,'');
          const browser=await chromium.launch({headless:true});
          let failed=false;
          function assert(ok,msg,details){if(!ok){failed=true;console.error('FAIL',msg,details||'')}else console.log('PASS',msg)}
          async function open(path){
            const context=await browser.newContext();
            await context.route(/googletagmanager\.com|connect\.facebook\.net/,r=>r.abort());
            const page=await context.newPage();
            await page.addInitScript(()=>{try{localStorage.setItem('credituz_consent','all')}catch(e){}});
            await page.goto(base+path+'?utm_source=qa&utm_medium=cpc&utm_campaign=tracking-smoke&utm_content=runtime&gclid=QA-GCLID',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(800);
            return {context,page};
          }
          async function snapshot(page){return await page.evaluate(()=>({
            events:(window.dataLayer||[]).filter(x=>x&&x.event).map(x=>({event:x.event,cta_id:x.cta_id,utm_source:x.utm_source,utm_campaign:x.utm_campaign,gclid:x.gclid})),
            fbq:(window.fbq&&window.fbq.queue?window.fbq.queue:[]).map(x=>Array.from(x)),
            dashboard:[...document.querySelectorAll('a[href^="https://dashboard.usecredituz.com"]')].map(a=>a.href)
          }))}
          async function fire(page,selector){await page.evaluate(sel=>{const a=document.querySelector(sel);if(!a)throw new Error('selector not found '+sel);a.addEventListener('click',e=>e.preventDefault(),{once:true});a.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));},selector);await page.waitForTimeout(100)}

          {
            const {context,page}=await open('/');
            let s=await snapshot(page);
            assert(s.events.some(e=>e.event==='landing_view'&&e.utm_source==='qa'),'home landing_view carries UTM',s.events);
            const u=s.dashboard[0]&&new URL(s.dashboard[0]);
            assert(u&&u.searchParams.get('utm_source')==='qa'&&u.searchParams.get('gclid')==='QA-GCLID','home dashboard link preserves attribution',s.dashboard[0]);
            await fire(page,'[data-track="cta_hero_primary"]'); s=await snapshot(page);
            assert(s.events.some(e=>e.event==='marketing_cta_click'&&e.cta_id==='cta_hero_primary'),'home CTA emits marketing_cta_click',s.events);
            assert(s.events.some(e=>e.event==='signup_start'&&e.cta_id==='cta_hero_primary'),'home CTA emits signup_start',s.events);
            assert(s.fbq.some(x=>x[0]==='track'&&x[1]==='InitiateCheckout'),'home CTA queues Meta InitiateCheckout',s.fbq);
            await fire(page,'[data-track="cta_hero_demo"]'); s=await snapshot(page);
            assert(s.events.some(e=>e.event==='contact_start'&&e.cta_id==='cta_hero_demo'),'WhatsApp emits contact_start',s.events);
            assert(s.fbq.some(x=>x[0]==='track'&&x[1]==='Contact'),'WhatsApp queues Meta Contact',s.fbq);
            await context.close();
          }
          {
            const {context,page}=await open('/pages/credituz-score.html');
            let s=await snapshot(page);
            assert(s.events.some(e=>e.event==='landing_view'&&e.utm_source==='qa'),'Score landing_view carries UTM',s.events);
            const u=s.dashboard[0]&&new URL(s.dashboard[0]);
            assert(u&&u.searchParams.get('utm_source')==='qa'&&u.searchParams.get('gclid')==='QA-GCLID','Score dashboard link preserves attribution',s.dashboard[0]);
            await fire(page,'[data-track="score_buy_primary"]'); s=await snapshot(page);
            assert(s.events.some(e=>e.event==='marketing_cta_click'&&e.cta_id==='score_buy_primary'),'Score CTA emits marketing_cta_click',s.events);
            assert(s.events.some(e=>e.event==='signup_start'&&e.cta_id==='score_buy_primary'),'Score CTA emits signup_start',s.events);
            assert(s.fbq.some(x=>x[0]==='track'&&x[1]==='InitiateCheckout'&&x[2]&&x[2].value===27.70),'Score CTA queues Meta InitiateCheckout R$27,70',s.fbq);
            await context.close();
          }
          await browser.close();
          if(failed) process.exit(1);
          JS
          node tracking-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: qa-screenshots/
          retention-days: 7
