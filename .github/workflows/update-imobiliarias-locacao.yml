name: Update imobiliarias locacao positioning
on:
  push:
    branches: [feat/imobiliarias-score-locacao]
    paths:
      - .github/workflows/update-imobiliarias-locacao.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/imobiliarias-score-locacao
          fetch-depth: 0
      - name: Strengthen tenant credit analysis
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pages/imobiliarias.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Analise o comprador, simule em múltiplos bancos, solicite o financiamento e acompanhe cada etapa até a contratação com o CRM de crédito da Credituz.','Analise compradores e inquilinos, simule financiamentos em múltiplos bancos e use score e política de crédito para reduzir risco antes da venda ou locação.')
          s=s.replace('<span><b>Score</b> antes de avançar a venda</span>','<span><b>Score</b> para compradores e inquilinos</span>')
          s=s.replace('<div class="tag">Também administra locação?</div>\n  <h2>Use a mesma infraestrutura para analisar e cobrar sua carteira.</h2>\n  <p class="sub">Para operações de locação, a Credituz também pode apoiar a análise do inquilino e organizar cobrança, recebíveis e conciliação conforme os recursos contratados e disponíveis.</p>','<div class="tag">Crédito também protege a locação</div>\n  <h2>Analise o inquilino antes de entregar a chave.</h2>\n  <p class="sub">A inadimplência começa antes do primeiro boleto. Use score, política de crédito e sinais de risco para avaliar capacidade de pagamento e padronizar a aprovação de locatários antes de assinar o contrato.</p>')
          s=s.replace('<div class="card"><div class="num">01</div><h3>Análise de crédito</h3><p>Score, política própria e sinais de risco para apoiar a decisão de locação.</p></div>','<div class="card"><div class="num">01</div><h3>Score do inquilino</h3><p>Consulte score, restrições e sinais financeiros para apoiar a decisão antes de aprovar a locação.</p></div>')
          s=s.replace('<div class="card"><div class="num">02</div><h3>Cobrança e recebíveis</h3><p>Organize régua de cobrança, meios de pagamento e baixa/conciliação da carteira.</p></div>','<div class="card"><div class="num">02</div><h3>Política de crédito própria</h3><p>Defina critérios de renda, comprometimento e perfil aceito para que a aprovação não dependa apenas do feeling do corretor.</p></div>\n    <div class="card"><div class="num">03</div><h3>Cobrança e recebíveis</h3><p>Depois da aprovação, organize régua de cobrança, meios de pagamento e baixa/conciliação da carteira.</p></div>')
          s=s.replace('CRM de crédito para analisar compradores, simular, solicitar e acompanhar financiamentos imobiliários.','CRM de crédito para analisar compradores e inquilinos, simular, solicitar e acompanhar financiamentos imobiliários.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'Analise o inquilino antes de entregar a chave' pages/imobiliarias.html
          grep -q 'Score do inquilino' pages/imobiliarias.html
          grep -q 'Score</b> para compradores e inquilinos' pages/imobiliarias.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/imobiliarias.html
          git commit -m "feat: strengthen tenant score positioning for imobiliarias"
          git push origin HEAD:feat/imobiliarias-score-locacao
