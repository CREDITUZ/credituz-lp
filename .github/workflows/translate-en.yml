name: Traduzir LP para o ingles

# Dispara quando paginas de marketing em PT mudam no main, e tambem manualmente.
# Nao dispara ao alterar en/**, entao o commit do proprio Action nao gera loop.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "white-label.html"
      - "pages/incorporadoras.html"
      - "pages/imobiliarias.html"
      - "pages/seja-parceiro.html"
      - "pages/locacao-temporada.html"
      - "pages/integracoes.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-en
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historico completo: sem ele o rebase antes do push nao tem base.
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install beautifulsoup4
      # Dois runs para o mesmo push chegaram a rodar juntos: o segundo traduziu
      # tudo de novo sobre um checkout velho e perdeu o push. Puxar a main aqui
      # faz ele encontrar o cache que o primeiro acabou de gravar e nao gastar
      # cota repetindo o trabalho.
      - name: Sincronizar com a main antes de traduzir
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Traduzir paginas de marketing para en/
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          # Para conta DeepL Pro, descomente:
          # DEEPL_API_URL: https://api.deepl.com/v2/translate
        run: python scripts/translate_en.py
      # O cache entra no mesmo commit das paginas: e ele que faz a proxima
      # execucao mandar so o texto alterado para a API, em vez das 7 paginas
      # inteiras (~49 mil caracteres por rodada).
      - name: Commit das paginas EN e do cache se houve mudanca
        run: |
          if [ -n "$(git status --porcelain en/ scripts/translation-cache.json)" ]; then
            git config user.name "credituz-i18n-bot"
            git config user.email "actions@users.noreply.github.com"
            git add en/ scripts/translation-cache.json
            git commit -m "chore(i18n): traduz automaticamente paginas EN [skip ci]"
            # Se alguem empurrou para a main enquanto o job traduzia, o push e
            # recusado e a traducao — ja paga em cota — se perde com o runner.
            # Rebase e tenta de novo.
            for tentativa in 1 2 3; do
              if git push; then exit 0; fi
              echo "push recusado, rebaseando (tentativa $tentativa)"
              if ! git pull --rebase origin main; then
                # O unico conflito esperado e o cache, que as duas execucoes
                # reescrevem. Descartar um lado jogaria fora traducao ja paga,
                # entao os dois sao unidos.
                if git diff --name-only --diff-filter=U | grep -qx scripts/translation-cache.json; then
                  python3 scripts/merge_translation_cache.py
                  git add scripts/translation-cache.json
                  GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
                else
                  echo "conflito fora do cache, abortando"
                  git rebase --abort
                  exit 1
                fi
              fi
              sleep 5
            done
            echo "nao foi possivel empurrar apos 3 tentativas"
            exit 1
          else
            echo "Sem mudancas em en/ nem no cache"
          fi
