name: Update pricing Score OS Enterprise
on:
  push:
    branches: [feat/pricing-score-os-enterprise]
    paths:
      - .github/workflows/update-pricing-score-os-enterprise.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pricing-score-os-enterprise
          fetch-depth: 0
      - name: Update pricing, plan names and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Reordena a lista de solucoes: Score primeiro, CRM segundo.
          old_order = '''<li><a href="./pages/crm-de-credito.html">CRM de crédito</a></li>\n          <li><a href="./pages/credituz-score.html">Credituz Score</a></li>'''
          new_order = '''<li><a href="./pages/credituz-score.html">Score de crédito</a></li>\n          <li><a href="./pages/crm-de-credito.html">CRM de crédito</a></li>'''
          s = s.replace(old_order, new_order)

          # Atualiza nomenclatura visivel do plano no ROI e textos auxiliares.
          s = s.replace('<span class="roi-profile-title">Growth</span>', '<span class="roi-profile-title">Credituz OS</span>')
          s = s.replace('fatia de 40% do Growth', 'fatia de 40% do Credituz OS')
          s = s.replace('plano Growth (R$ 297/mês)', 'Credituz OS (R$ 297/mês)')

          pricing_css = r'''<style id="pricing-choice-styles">
#pricing.pricing-choice{background:#f5f5f7;padding:88px 32px 96px}
.pricing-choice-inner{max-width:1320px;margin:0 auto}
.pricing-choice-head{text-align:center;max-width:980px;margin:0 auto 44px}
.pricing-choice-kicker{font-size:15px;font-weight:700;color:#0071e3;margin-bottom:18px}
.pricing-choice-head h2{font-size:clamp(42px,5.5vw,68px);line-height:1.02;letter-spacing:-.045em;font-weight:600;max-width:980px;margin:0 auto}
.pricing-choice-head p{font-size:clamp(17px,1.7vw,20px);line-height:1.55;color:#6e6e73;max-width:900px;margin:24px auto 0}
.pricing-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:stretch}
.pricing-choice-card{background:#fff;border:1px solid #d2d2d7;border-radius:28px;padding:34px 34px 30px;display:flex;flex-direction:column;min-width:0}
.pricing-choice-card.featured{border-color:#86bfff;box-shadow:0 0 0 3px rgba(0,113,227,.07)}
.pricing-choice-type{font-size:14px;font-weight:700;color:#0071e3;margin-bottom:12px}
.pricing-choice-name{font-size:32px;line-height:1.08;letter-spacing:-.035em;font-weight:650;margin-bottom:20px}
.pricing-choice-price{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.pricing-choice-price strong{font-size:46px;line-height:.98;letter-spacing:-.045em;font-weight:700}
.pricing-choice-price span{font-size:14px;color:#6e6e73;padding-bottom:5px}
.pricing-choice-desc{font-size:16px;line-height:1.55;color:#6e6e73;min-height:74px;margin-bottom:26px}
.pricing-choice-list{list-style:none;display:flex;flex-direction:column;gap:14px;margin:0 0 30px;padding:0;flex:1}
.pricing-choice-list li{position:relative;padding-left:28px;font-size:15px;line-height:1.45;color:#2f2f32}
.pricing-choice-list li:before{content:'✓';position:absolute;left:0;top:-1px;color:#16c447;font-size:19px;font-weight:700}
.pricing-choice-list strong{font-weight:650;color:#1d1d1f}
.pricing-choice-cta{display:inline-flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;padding:0 24px;background:#1d1d1f;color:#fff;text-decoration:none;font-size:15px;font-weight:700;align-self:flex-start;transition:transform .18s,background .18s}
.pricing-choice-cta:hover{transform:translateY(-1px)}
.pricing-choice-card.featured .pricing-choice-cta{background:#0071e3}
.pricing-choice-card.featured .pricing-choice-cta:hover{background:#0066cc}
.pricing-choice-enterprise .pricing-choice-cta{background:#fff;color:#1d1d1f;border:1px solid #1d1d1f}
.pricing-choice-footnote{max-width:940px;margin:28px auto 0;text-align:center;color:#6e6e73;font-size:13.5px;line-height:1.5}
.pricing-choice-footnote strong{color:#1d1d1f}
@media(max-width:1020px){#pricing.pricing-choice{padding:72px 22px 80px}.pricing-choice-grid{grid-template-columns:1fr;max-width:760px;margin:0 auto}.pricing-choice-desc{min-height:0}.pricing-choice-card{padding:30px}}
@media(max-width:560px){#pricing.pricing-choice{padding:64px 18px 70px}.pricing-choice-head{margin-bottom:32px}.pricing-choice-head h2{font-size:40px}.pricing-choice-card{border-radius:22px;padding:26px 22px}.pricing-choice-name{font-size:29px}.pricing-choice-price strong{font-size:41px}.pricing-choice-list li{font-size:14.5px}}
</style>'''

          pricing_html = r'''<!-- PRICING -->
<section id="pricing" class="pricing-choice">
  <div class="pricing-choice-inner">
    <div class="pricing-choice-head">
      <div class="pricing-choice-kicker">Comece do jeito que faz sentido para sua operação</div>
      <h2>Uma análise avulsa ou a operação completa.</h2>
      <p>Quem consulta ocasionalmente pode começar pelo Credituz Score. Quem analisa clientes todos os meses ganha escala com o Credituz OS. Operações maiores podem evoluir para o Enterprise.</p>
    </div>

    <div class="pricing-choice-grid">
      <article class="pricing-choice-card">
        <div class="pricing-choice-type">Uso ocasional</div>
        <h3 class="pricing-choice-name">Credituz Score</h3>
        <div class="pricing-choice-price"><strong>R$ 27,70</strong><span>/análise</span></div>
        <p class="pricing-choice-desc">Uma análise completa de crédito, sem assinatura e sem mensalidade. Pague apenas quando precisar.</p>
        <ul class="pricing-choice-list">
          <li><strong>Score e sinais de risco</strong></li>
          <li>Renda estimada e parcela máxima</li>
          <li>Restrições, protestos e processos</li>
          <li>Consulta avulsa, sem fidelidade</li>
        </ul>
        <a class="pricing-choice-cta" href="https://dashboard.usecredituz.com/auth/login?screen_hint=signup&ref=home-pricing-score" data-track="cta_pricing_score">Fazer uma análise</a>
      </article>

      <article class="pricing-choice-card featured">
        <div class="pricing-choice-type">Uso profissional recorrente</div>
        <h3 class="pricing-choice-name">Credituz OS</h3>
        <div class="pricing-choice-price"><strong>R$ 297</strong><span>/mês + R$ 16 por análise</span></div>
        <p class="pricing-choice-desc">Para quem quer analisar clientes, simular, solicitar e acompanhar crédito dentro da mesma operação.</p>
        <ul class="pricing-choice-list">
          <li><strong>CRM de crédito + CORBAN AI</strong></li>
          <li><strong>Análises por R$ 16</strong></li>
          <li>Simulação multibanco, solicitação e acompanhamento do financiamento</li>
          <li>Contratos com IA, assinatura digital e cartório digital</li>
          <li>Cobrança e recebíveis com WhatsApp, SMS e e-mail, boleto, Pix, baixa e conciliação</li>
          <li>Portal de vendas, espelho de empreendimento e gestão de unidades</li>
          <li>Analytics de crédito e carteira</li>
          <li><strong>40% da comissão de originação</strong></li>
          <li>3 usuários · até 100 empreendimentos · 20 GB</li>
        </ul>
        <a class="pricing-choice-cta" href="https://dashboard.usecredituz.com/auth/login?screen_hint=signup&ref=home-pricing-os" data-track="cta_pricing_os">Criar minha conta</a>
      </article>

      <article class="pricing-choice-card pricing-choice-enterprise">
        <div class="pricing-choice-type">Operação em escala</div>
        <h3 class="pricing-choice-name">Enterprise</h3>
        <div class="pricing-choice-price"><strong>Sob medida</strong><span>contrato anual</span></div>
        <p class="pricing-choice-desc">Para redes, holdings e operações imobiliárias que precisam de multiempresa, integrações, marca própria e regras customizadas.</p>
        <ul class="pricing-choice-list">
          <li><strong>Tudo do Credituz OS</strong></li>
          <li>Usuários, empreendimentos e contratos ilimitados · multiempresa</li>
          <li>Políticas de crédito por empresa e por produto</li>
          <li><strong>75% da comissão de originação</strong></li>
          <li>Back office operacional e financeiro para repasses, carteira e pós-venda</li>
          <li>Régua de cobrança customizada por carteira</li>
          <li>NFe e contas Credituz by Asaas ou banco escolhido via API</li>
          <li>White Label · API pública · SSO · auditoria · SLA 99,9%</li>
          <li>CS nominal e armazenamento customizado</li>
        </ul>
        <a class="pricing-choice-cta" href="https://wa.me/5511936209409" target="_blank" rel="noopener" data-track="cta_pricing_enterprise">Falar com um especialista</a>
      </article>
    </div>

    <p class="pricing-choice-footnote"><strong>Quando vale migrar?</strong> Considerando apenas mensalidade e consultas, a partir de 26 análises por mês o Credituz OS já fica mais barato do que pagar R$ 27,70 por análise avulsa.</p>
  </div>
</section>'''

          # Remove eventual versao anterior do estilo e injeta o novo estilo imediatamente antes do pricing.
          s = re.sub(r'<style id="pricing-choice-styles">.*?</style>\s*', '', s, count=1, flags=re.S)
          pattern = r'<!-- PRICING -->\s*<section id="pricing">.*?</section>'
          if not re.search(pattern, s, flags=re.S):
              raise SystemExit('pricing section not found')
          s = re.sub(pattern, pricing_css + '\n\n' + pricing_html, s, count=1, flags=re.S)

          # JSON-LD da home: tres ofertas com os nomes definitivos.
          old_offers = '''"offers":[{"@type":"Offer","name":"Growth","price":"297","priceCurrency":"BRL","description":"Operação inteira: análise de crédito com política própria, consulta a bureaus e capacidade de renda; simulação e formalização multibanco ilimitada (imobiliário, construção, home equity e auto equity); 50 contratos e documentos com IA e 20 assinaturas digitais por mês, com cartório digital incluso; cobrança e recebíveis com régua automática, boleto, Pix, baixa e conciliação; espelho de empreendimento; portal de vendas em domínio próprio, Google Meu Negócio e CRM; 3 usuários e 40% da comissão de originação."},{"@type":"Offer","name":"Enterprise","priceCurrency":"BRL","description":"Preço customizado, contrato anual: tudo do plano Growth, mais usuários e contratos ilimitados, multi-empresa, 75% da comissão de originação, políticas de crédito por empresa e por produto, back office operacional e financeiro (repasses, locação, pós-venda e gestão da carteira), régua de cobrança customizada, NFe, contas Asaas ou banco via API, White Label, API pública, SSO e SLA 99,9%."}]'''
          new_offers = '''"offers":[{"@type":"Offer","name":"Credituz Score","price":"27.70","priceCurrency":"BRL","description":"Análise completa de crédito avulsa, sem assinatura ou mensalidade."},{"@type":"Offer","name":"Credituz OS","price":"297","priceCurrency":"BRL","description":"R$ 297 por mês mais R$ 16 por análise. CRM de crédito, CORBAN AI, simulação e acompanhamento de financiamento, contratos, cobrança, recebíveis, portal, gestão de unidades e analytics. 40% da comissão de originação."},{"@type":"Offer","name":"Enterprise","priceCurrency":"BRL","description":"Preço sob medida, contrato anual: tudo do Credituz OS, mais multiempresa, usuários e contratos ilimitados, 75% da comissão de originação, políticas por empresa e produto, back office operacional e financeiro, cobrança customizada, NFe, contas via API, White Label, API pública, SSO, auditoria e SLA 99,9%."}]'''
          if old_offers not in s:
              raise SystemExit('home inline offers block not found')
          s = s.replace(old_offers, new_offers, 1)
          s = s.replace('R$ 297 por mês. É um plano único, com a plataforma inteira: CRM de crédito, agentes de IA, simulação multibancos, solicitação e acompanhamento de financiamentos, contratos, portal de vendas no domínio do cliente e originação de crédito. O cadastro é self-serve e o cancelamento também, dentro da plataforma.', 'Você pode começar pelo Credituz Score por R$ 27,70 por análise, sem mensalidade. Para uso recorrente, o Credituz OS custa R$ 297 por mês mais R$ 16 por análise. O Enterprise tem preço sob medida para operações em escala.')
          p.write_text(s, encoding='utf-8')

          # home.json machine-readable.
          hp = Path('home.json')
          data = json.loads(hp.read_text(encoding='utf-8'))
          graph = data.get('@graph', [])
          for node in graph:
              if node.get('@type') == 'SoftwareApplication':
                  node['offers'] = [
                      {'@type':'Offer','name':'Credituz Score','price':'27.70','priceCurrency':'BRL','description':'Análise completa de crédito avulsa, sem assinatura ou mensalidade.'},
                      {'@type':'Offer','name':'Credituz OS','price':'297','priceCurrency':'BRL','description':'R$ 297 por mês mais R$ 16 por análise. CRM de crédito, CORBAN AI, financiamento, contratos, cobrança, recebíveis, portal, gestão de unidades e analytics. 40% da comissão de originação.'},
                      {'@type':'Offer','name':'Enterprise','priceCurrency':'BRL','description':'Preço sob medida, contrato anual: tudo do Credituz OS, mais multiempresa, escala, 75% da comissão, políticas customizadas, back office operacional e financeiro, White Label, API, SSO, auditoria e SLA 99,9%.'}
                  ]
              if node.get('@type') == 'FAQPage':
                  for item in node.get('mainEntity', []):
                      if item.get('name') == 'Quanto custa começar?':
                          item['acceptedAnswer']['text'] = 'Você pode começar pelo Credituz Score por R$ 27,70 por análise, sem mensalidade. Para uso recorrente, o Credituz OS custa R$ 297 por mês mais R$ 16 por análise. O Enterprise tem preço sob medida para operações em escala.'
          hp.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Atualiza o bloco principal de planos nas fontes textuais para IA.
          new_plans_md = '''## Planos e preços\n\nA Credituz tem três formas de uso, conforme a maturidade e o volume da operação:\n\n- **Credituz Score — R$ 27,70 por análise**: consulta avulsa, sem assinatura ou mensalidade. Entrega score e sinais de risco, renda estimada e parcela máxima, restrições, protestos, processos e demais dados disponíveis no relatório.\n- **Credituz OS — R$ 297/mês + R$ 16 por análise**: uso profissional recorrente. Inclui CRM de crédito + CORBAN AI, simulação, solicitação e acompanhamento de financiamento, contratos com IA, assinatura e cartório digital, cobrança e recebíveis, portal de vendas, espelho de empreendimento, gestão de unidades, analytics e 40% da comissão de originação.\n- **Enterprise — preço sob medida, contrato anual**: tudo do Credituz OS, mais multiempresa, usuários, empreendimentos e contratos ilimitados, 75% da comissão de originação, políticas por empresa e produto, back office operacional e financeiro, cobrança customizada, NFe, contas via API, White Label, API pública, SSO, auditoria, SLA 99,9%, CS nominal e armazenamento customizado.\n\nConsiderando apenas mensalidade e consultas, a partir de 26 análises por mês o Credituz OS fica mais barato do que pagar R$ 27,70 por análise avulsa.\n'''
          for file in ['home.md', 'llms-full.txt']:
              fp = Path(file)
              text = fp.read_text(encoding='utf-8')
              text, n = re.subn(r'## Planos e preços\n.*?(?=\n## )', new_plans_md.rstrip(), text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'plans section not found in {file}')
              fp.write_text(text, encoding='utf-8')

          # Mantem o nome Credituz OS em paginas de segmento onde o antigo nome do plano ainda aparece.
          for file in ['pages/construtoras.html', 'pages/imobiliarias.html']:
              fp = Path(file)
              if fp.exists():
                  text = fp.read_text(encoding='utf-8').replace('Growth', 'Credituz OS')
                  fp.write_text(text, encoding='utf-8')
          PY

      - name: Validate pricing and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          s = Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="pricing"') == 1
          assert 'Uma análise avulsa ou a operação completa.' in s
          assert 'Credituz Score' in s and 'Credituz OS' in s and 'Enterprise' in s
          assert 'R$ 27,70' in s and 'R$ 297' in s and 'R$ 16 por análise' in s
          assert 'a partir de 26 análises por mês' in s
          score = s.find('./pages/credituz-score.html">Score de crédito</a>')
          crm = s.find('./pages/crm-de-credito.html">CRM de crédito</a>')
          assert score != -1 and crm != -1 and score < crm
          assert '<span class="roi-profile-title">Growth</span>' not in s
          assert 'gestão de obras' not in s.lower()
          assert 'medições de obra' not in s.lower()
          data = json.loads(Path('home.json').read_text(encoding='utf-8'))
          app = next(x for x in data['@graph'] if x.get('@type') == 'SoftwareApplication')
          assert [x['name'] for x in app['offers']] == ['Credituz Score','Credituz OS','Enterprise']
          print('pricing and navigation validated')
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-pricing-score-os-enterprise.yml
          git add index.html home.json home.md llms-full.txt pages/construtoras.html pages/imobiliarias.html
          git commit -m "feat: unify pricing around Score, Credituz OS and Enterprise"
          git push origin HEAD:feat/pricing-score-os-enterprise
