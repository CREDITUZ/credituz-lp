name: Update pricing Score OS Enterprise v2
on:
  push:
    branches:
      - feat/pricing-score-os-enterprise
    paths:
      - scripts/oneoff_update_pricing.py
      - .github/workflows/update-pricing-score-os-enterprise-v2.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pricing-score-os-enterprise
          fetch-depth: 0
      - name: Run updater
        run: python3 scripts/oneoff_update_pricing.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/oneoff_update_pricing.py .github/workflows/update-pricing-score-os-enterprise.yml .github/workflows/update-pricing-score-os-enterprise-v2.yml
          git add index.html home.json home.md llms-full.txt pages/construtoras.html pages/imobiliarias.html
          git commit -m "feat: unify pricing around Score, Credituz OS and Enterprise"
          git push origin HEAD:feat/pricing-score-os-enterprise
