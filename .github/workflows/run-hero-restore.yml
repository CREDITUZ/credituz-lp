name: Run hero restore
on:
  push:
    branches:
      - fix/hero-previous-visual-social-proof
    paths:
      - .github/workflows/run-hero-restore.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-previous-visual-social-proof
          fetch-depth: 0
      - name: Apply approved hero adjustments
        run: python3 scripts/restore-hero-visual-proof.py
      - name: Validate copy and restored blocks
        run: |
          grep -q 'Sistema operacional e financeiro' index.html
          grep -q 'Análise crédito, cobrança e financiamento com <em>agentes de IA.</em>' index.html
          grep -q 'comparando 8 instituições' index.html
          grep -q 'Grupo Valore · NJS Engenharia · Bilha Imóveis e outras operações que já vendem e cobram com a Credituz' index.html
          grep -q 'Credituz OS analisa e cobra. CORBAN AI financia. Enterprise customiza e conecta.' index.html
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*type=["\x27]application/ld\+json["\x27])[^>]*>(.*?)</script>',s,re.I|re.S)
          out=Path('/tmp/inline-js-hero')
          out.mkdir(exist_ok=True)
          for i,x in enumerate(scripts,1):
              (out/f'{i:02d}.js').write_text(x,encoding='utf-8')
          print('inline scripts:',len(scripts))
          PY
          for f in /tmp/inline-js-hero/*.js; do node --check "$f"; done
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/restore-hero-visual-proof.py .github/workflows/run-hero-restore.yml
          git add index.html home.md home.json llms.txt llms-full.txt
          git commit -m "fix: restore previous hero visual and social proof"
          git push origin HEAD:fix/hero-previous-visual-social-proof
