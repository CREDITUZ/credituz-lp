name: Update home solutions navigation

on:
  push:
    branches:
      - feat/home-solutions-navigation
    paths:
      - .github/workflows/update-home-solutions-nav.yml

permissions:
  contents: write

jobs:
  update-home:
    runs-on: ubuntu-latest
    steps:
      - name: Update index through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = 'CREDITUZ/credituz-lp'
          branch = 'feat/home-solutions-navigation'
          api = f'https://api.github.com/repos/{repo}/contents/index.html'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'credituz-home-nav-updater'
          }
          req = urllib.request.Request(api + '?' + urllib.parse.urlencode({'ref': branch}), headers=headers)
          with urllib.request.urlopen(req) as r:
              current = json.load(r)
          text = base64.b64decode(current['content']).decode('utf-8')

          old_nav = '            <li><a href="#produto-por-dentro">Produto</a></li>'
          new_nav = '''            <li class="nav-has-sub">
                <a href="#produto" class="nav-sub-trigger">Soluções <span class="nav-caret">▾</span></a>
                <ul class="nav-submenu">
                    <li><a href="#produto">CRM com IA</a></li>
                    <li><a href="./pages/analise-de-credito-score-incorporadoras.html">Crédito e score</a></li>
                    <li><a href="./pages/contratos-imobiliarios-digitais.html">Contratos e assinatura</a></li>
                    <li><a href="./pages/cobranca-e-recebiveis-imobiliarios.html">Cobrança e recebíveis</a></li>
                    <li><a href="./pages/portal-vendas-empreendimentos.html">Portal de vendas</a></li>
                    <li><a href="./pages/gestao-de-unidades-imobiliarias.html">Gestão de unidades</a></li>
                </ul>
            </li>'''

          old_footer = '''            <div class="footer-col">
                <h4>Produto</h4>
                <ul>
                    <li><a href="#produto">CRM com IA</a></li>
                    <li><a href="#produto">Simulação de Crédito</a></li>
                    <li><a href="#produto">Intelligence AI</a></li>
                    <li><a href="#financeiro">Gestão Financeira</a></li>
                    <li><a href="#produto">Régua de cobrança</a></li>
                </ul>
            </div>'''
          new_footer = '''            <div class="footer-col">
                <h4>Soluções</h4>
                <ul>
                    <li><a href="#produto">CRM com IA</a></li>
                    <li><a href="./pages/analise-de-credito-score-incorporadoras.html">Crédito e score</a></li>
                    <li><a href="./pages/contratos-imobiliarios-digitais.html">Contratos e assinatura</a></li>
                    <li><a href="./pages/cobranca-e-recebiveis-imobiliarios.html">Cobrança e recebíveis</a></li>
                    <li><a href="./pages/portal-vendas-empreendimentos.html">Portal de vendas</a></li>
                    <li><a href="./pages/gestao-de-unidades-imobiliarias.html">Gestão de unidades</a></li>
                </ul>
            </div>'''

          if old_nav not in text:
              raise SystemExit('nav target not found')
          if old_footer not in text:
              raise SystemExit('footer target not found')

          updated = text.replace(old_nav, new_nav, 1).replace(old_footer, new_footer, 1)
          body = json.dumps({
              'message': 'feat: expose solution hubs in home navigation',
              'content': base64.b64encode(updated.encode('utf-8')).decode('ascii'),
              'sha': current['sha'],
              'branch': branch
          }).encode('utf-8')
          put = urllib.request.Request(api, data=body, headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
          with urllib.request.urlopen(put) as r:
              result = json.load(r)
          print(result['commit']['sha'])
          PY
