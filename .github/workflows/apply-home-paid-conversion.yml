name: Apply home paid traffic conversion
on:
  push:
    branches:
      - feat/home-paid-traffic-conversion
    paths:
      - scripts/apply_home_paid_conversion.py
      - .github/workflows/apply-home-paid-conversion.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-paid-traffic-conversion
          fetch-depth: 0
      - name: Apply homepage transform
        run: python3 scripts/apply_home_paid_conversion.py
      - name: Commit homepage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: optimize homepage for paid traffic conversion"
          git push origin HEAD:feat/home-paid-traffic-conversion
