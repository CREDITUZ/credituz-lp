name: Run home problem updater
on:
  push:
    branches:
      - feat/home-problem-backoffice-positioning
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-problem-backoffice-positioning
          fetch-depth: 0
      - run: python3 scripts/update_home_problem_backoffice.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/update-home-problem-backoffice.yml .github/workflows/update-home-problem-backoffice-v2.yml .github/workflows/run-home-problem-updater.yml scripts/update_home_problem_backoffice.py
          git add index.html home.md llms-full.txt home.json
          git commit -m "feat: align problem narrative with real estate back office"
          git push origin HEAD:feat/home-problem-backoffice-positioning
