name: Update plan user limits
on:
  push:
    branches: [fix/cobranca-ai-015-sms-enterprise]
    paths:
      - .github/workflows/update-plan-user-limits.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cobranca-ai-015-sms-enterprise
          fetch-depth: 0
      - name: Update plan user limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="pricing-choice-price"><strong>R$ 297</strong><span>/mês + R$ 16 por análise</span></div>', '<div class="pricing-choice-price"><strong>R$ 297</strong><span>/mês + R$ 16 por análise · até 3 usuários</span></div>')
          s=s.replace('<li>3 usuários · até 100 empreendimentos · 20 GB</li>', '<li><strong>Até 3 usuários</strong> · até 100 empreendimentos · 20 GB</li>')
          s=s.replace('<li>Usuários, empreendimentos e contratos ilimitados · multiempresa</li>', '<li><strong>Usuários e escopo customizados</strong> conforme a operação · multiempresa</li>')
          s=s.replace('<div class="pricing-choice-price"><strong>Sob medida</strong><span>contrato anual</span></div>', '<div class="pricing-choice-price"><strong>Sob medida</strong><span>usuários e escopo customizados · contrato anual</span></div>')
          s=s.replace('CRM de crédito, CORBAN AI, simulação e acompanhamento de financiamento, contratos e régua de cobrança com IA em WhatsApp e e-mail por R$ 0,15 por envio, recebíveis, portal, gestão de unidades e analytics. 40% da comissão de originação.', 'CRM de crédito, CORBAN AI, simulação e acompanhamento de financiamento, contratos e régua de cobrança com IA em WhatsApp e e-mail por R$ 0,15 por envio, recebíveis, portal, gestão de unidades e analytics. Até 3 usuários e 40% da comissão de originação.')
          s=s.replace('Preço sob medida, contrato anual: tudo do Credituz OS, mais multiempresa, usuários e contratos ilimitados, 75% da comissão de originação, políticas por empresa e produto, back office operacional e financeiro, cobrança customizada com SMS disponível, NFe, contas via API, White Label, API pública, SSO, auditoria e SLA 99,9%.', 'Preço sob medida, contrato anual: tudo do Credituz OS, mais usuários e escopo customizados conforme a operação, multiempresa, 75% da comissão de originação, políticas por empresa e produto, back office operacional e financeiro, cobrança customizada com SMS disponível, NFe, contas via API, White Label, API pública, SSO, auditoria e SLA 99,9%.')
          p.write_text(s,encoding='utf-8')

          p=Path('home.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          for node in data.get('@graph',[]):
              if node.get('@type')=='SoftwareApplication':
                  for offer in node.get('offers',[]):
                      if offer.get('name')=='Credituz OS':
                          offer['description']='R$ 297 por mês mais R$ 16 por análise. CRM de crédito, CORBAN AI, financiamento, contratos, régua de cobrança com IA em WhatsApp e e-mail por R$ 0,15 por envio, recebíveis, portal, gestão de unidades e analytics. Até 3 usuários e 40% da comissão de originação.'
                      elif offer.get('name')=='Enterprise':
                          offer['description']='Preço sob medida, contrato anual: tudo do Credituz OS, mais usuários e escopo customizados conforme a operação, multiempresa, 75% da comissão, políticas customizadas, back office operacional e financeiro, cobrança customizada com SMS disponível, White Label, API, SSO, auditoria e SLA 99,9%.'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for file in ['home.md','llms-full.txt']:
              p=Path(file); s=p.read_text(encoding='utf-8')
              s=s.replace('analytics e 40% da comissão de originação.', 'analytics, até 3 usuários e 40% da comissão de originação.')
              s=s.replace('mais multiempresa, usuários, empreendimentos e contratos ilimitados, 75% da comissão de originação', 'mais usuários e escopo customizados conforme a operação, multiempresa, 75% da comissão de originação')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -q 'até 3 usuários' index.html
          grep -q 'Usuários e escopo customizados' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-plan-user-limits.yml
          git add index.html home.json home.md llms-full.txt
          git commit -m "fix: clarify user limits by plan"
          git push origin HEAD:fix/cobranca-ai-015-sms-enterprise
