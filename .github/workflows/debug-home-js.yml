name: Debug home JS
on:
  push:
    branches: [fix/home-js-qa]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect inline JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*type=["\']application/ld\+json["\'])[^>]*>(.*?)</script>',s,re.I|re.S)
          x=scripts[5]
          for i,line in enumerate(x.splitlines(),1):
              if 35 <= i <= 58:
                  print(f'{i:03d}: {line}')
          Path('/tmp/06.js').write_text(x,encoding='utf-8')
          PY
          node --check /tmp/06.js
