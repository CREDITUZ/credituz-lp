name: Fix hero title
on:
  push:
    branches:
      - fix/hero-title-analise-de-credito
    paths:
      - .github/workflows/run-fix-hero-title.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hero-title-analise-de-credito
          fetch-depth: 0
      - name: Correct hero title
        run: python3 scripts/fix-hero-title-analise-de-credito.py
      - name: Validate
        run: grep -q 'Análise de crédito, cobrança e financiamento com <em>agentes de IA.</em>' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix-hero-title-analise-de-credito.py .github/workflows/run-fix-hero-title.yml
          git add index.html
          git commit -m "fix: corrige título do hero para análise de crédito"
          git push origin HEAD:fix/hero-title-analise-de-credito
