name: Run horizontal home architecture migration
on:
  push:
    branches:
      - feat/home-horizontal-products-architecture
    paths:
      - .github/workflows/run-home-horizontal-products.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-horizontal-products-architecture
          fetch-depth: 0
      - name: Apply approved home architecture
        run: python3 scripts/reframe-home-horizontal.py
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*type=["\']application/ld\+json["\'])[^>]*>(.*?)</script>',s,re.I|re.S)
          out=Path('/tmp/inline-js-home')
          out.mkdir(exist_ok=True)
          for i,x in enumerate(scripts,1):
              (out/f'{i:02d}.js').write_text(x,encoding='utf-8')
          print('inline scripts:',len(scripts))
          PY
          for f in /tmp/inline-js-home/*.js; do node --check "$f"; done
      - name: Validate approved boundaries
        run: |
          grep -q 'Credituz OS analisa e cobra. CORBAN AI financia. Enterprise customiza e conecta.' index.html
          grep -q 'CRM Corban' index.html
          grep -q 'Até 3 usuários' index.html
          grep -q 'Construtor de contratos com IA' index.html
          grep -q 'Soluções customizadas com IA' index.html
          grep -q 'Credituz OS — R$ 297/mês + R$ 16 por análise' home.md
          grep -q 'CORBAN AI — modelo comercial conforme a operação' home.md
          ! grep -q 'O imóvel é vendido.' index.html
          ! grep -q 'CRM de crédito + CORBAN AI' index.html
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/reframe-home-horizontal.py .github/workflows/run-home-horizontal-products.yml
          git add index.html home.md home.json llms.txt llms-full.txt
          git commit -m "feat: separate Credituz OS, CORBAN AI and Enterprise on home"
          git push origin HEAD:feat/home-horizontal-products-architecture
