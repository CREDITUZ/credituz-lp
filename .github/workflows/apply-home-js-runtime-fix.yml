name: Apply home JS runtime fix
on:
  push:
    branches: [fix/home-js-runtime]
    paths:
      - scripts/fix_home_js_runtime.py
      - .github/workflows/apply-home-js-runtime-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-js-runtime
          fetch-depth: 0
      - run: python3 scripts/fix_home_js_runtime.py
      - name: Validate all inline JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*type=["\']application/ld\+json["\'])[^>]*>(.*?)</script>',s,re.I|re.S)
          Path('/tmp/js').mkdir(exist_ok=True)
          for i,x in enumerate(scripts,1): (Path('/tmp/js')/f'{i:02d}.js').write_text(x,encoding='utf-8')
          PY
          for f in /tmp/js/*.js; do node --check "$f"; done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/deploy.yml
          git commit -m "fix: repair attribution runtime JS and gate deploy on syntax"
          git push origin HEAD:fix/home-js-runtime
