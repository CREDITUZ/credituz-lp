name: Atualizar titulo principal da LP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-hero-title-once.yml'

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar H1 da home
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<h1 class="hero-title" id="heroTitle">Análise de crédito, cobrança e financiamento com <em>agentes de IA.</em></h1>'
          new = '<h1 class="hero-title" id="heroTitle">Facilidade para quem quer financiar, cobrar ou analisar crédito no setor imobiliário.</h1>'

          if old not in text:
              raise SystemExit('Titulo atual nao encontrado; nenhuma alteracao foi feita.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remover workflow temporario
        run: rm .github/workflows/update-hero-title-once.yml

      - name: Commit e push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-hero-title-once.yml
          git commit -m "feat(home): atualiza titulo principal da LP"
          git pull --rebase origin main
          git push origin main
