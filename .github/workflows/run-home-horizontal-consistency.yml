name: Run home horizontal consistency cleanup
on:
  push:
    branches:
      - fix/home-horizontal-final-consistency
    paths:
      - .github/workflows/run-home-horizontal-consistency.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-horizontal-final-consistency
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 scripts/fix-home-horizontal-consistency.py
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in ['index.html','en/index.html']:
              s=Path(page).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?![^>]*type=["\']application/ld\+json["\'])[^>]*>(.*?)</script>',s,re.I|re.S)
              out=Path('/tmp')/('js-'+page.replace('/','-'))
              out.mkdir(exist_ok=True)
              for i,x in enumerate(scripts,1):
                  (out/f'{i:02d}.js').write_text(x,encoding='utf-8')
              print(page, len(scripts))
          PY
          for d in /tmp/js-*; do for f in "$d"/*.js; do node --check "$f"; done; done
      - name: Validate product boundaries
        run: |
          grep -q 'Começar com Credituz OS' index.html
          grep -q 'simulação multibanco + CRM Corban' index.html
          grep -q 'Cobrança com IA</a>' index.html
          grep -q 'Embedded credit</a>' index.html
          ! grep -q 'Primeiro contrato gerado' index.html
          ! grep -q '8 instituições em 30s' index.html
          ! grep -q 'Simulei com a sua renda e o FGTS' index.html
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/fix-home-horizontal-consistency.py .github/workflows/run-home-horizontal-consistency.yml
          git add index.html en/index.html
          git commit -m "fix: align hero and footer with horizontal product architecture"
          git push origin HEAD:fix/home-horizontal-final-consistency
