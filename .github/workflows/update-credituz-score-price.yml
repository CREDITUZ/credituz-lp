name: Update Credituz Score price
on:
  push:
    branches:
      - feat/credituz-score-price-2770
    paths:
      - .github/workflows/update-credituz-score-price.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/credituz-score-price-2770
          fetch-depth: 0
      - name: Update price references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('pages/credituz-score.html'),
              Path('pages/analise-de-credito-score-incorporadoras.html'),
          ]
          for p in paths:
              s = p.read_text(encoding='utf-8')
              s = s.replace('R$ 21,90', 'R$ 27,70')
              s = s.replace('21.90', '27.70')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/credituz-score.html pages/analise-de-credito-score-incorporadoras.html
          git commit -m "feat: update Credituz Score price to R$ 27,70"
          git push origin HEAD:feat/credituz-score-price-2770
